name: countdown_timer
description: 个人本地倒计时计时 App（无网络、无登录、数据本地保存）。
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 内置本地化：让日期选择器等系统组件显示中文
  flutter_localizations:
    sdk: flutter
  # 本地 SQLite 数据库（持久化计时记录）
  sqflite: ^2.3.3
  # 倒计时结束震动提醒
  vibration: ^1.8.4

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
